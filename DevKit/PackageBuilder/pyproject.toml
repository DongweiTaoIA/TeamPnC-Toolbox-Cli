[project]
name = "pnc-migration"
version = "0.1.0"
description = "PnC migration package build and deployment helper"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PySide6>=6.7",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
pnc-migration = "src.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
